<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>PorticoLLM</title>
    <meta name="title" content="PorticoLLM" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#0c1015" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g., Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'dark'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
    <!--
      首屏骨架：跨境回源 TTFB 约 0.9s，JS 到齐前先给出可感知的界面。
      必须放在 #root 之外 —— main.tsx 里有 `if (!rootElement.innerHTML)` 守卫，
      往 #root 里塞任何内容都会导致 React 永不挂载（整站空白）。
      React 挂载后 #root 非空，由下面的 CSS 规则自动隐藏骨架。
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0c1015;
      }
      html.light,
      html.light body {
        background: #ffffff;
      }
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
          sans-serif;
      }
      .app-splash__mark {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #e7eaf0;
        opacity: 0.92;
      }
      html.light .app-splash__mark {
        color: #1a1d23;
      }
      .app-splash__bar {
        width: 112px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      html.light .app-splash__bar {
        background: rgba(0, 0, 0, 0.1);
      }
      .app-splash__bar span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: 2px;
        background: #7c8cf8;
        animation: app-splash-slide 1.15s ease-in-out infinite;
      }
      @keyframes app-splash-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      /* React 挂载后 #root 非空，骨架自动让位 */
      #root:not(:empty) + #app-splash {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__bar span {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <div id="app-splash" class="app-splash" aria-hidden="true">
      <div class="app-splash__mark">PorticoLLM</div>
      <div class="app-splash__bar"><span></span></div>
    </div>
  </body>
</html>
